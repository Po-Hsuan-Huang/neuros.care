name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # This tells GitHub to run all 'run' commands inside the frontend folder
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # This ensures the cache looks for the lockfile inside the frontend folder
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build

      # 🔍 Confirm build output exists (Path updated to frontend/dist)
      - name: Check dist directory
        working-directory: . # Temporarily reset to root to see the full path
        run: |
          echo "Current directory:"
          pwd
          echo "List frontend/dist directory:"
          ls -la frontend/dist || echo "❌ dist directory not found"

      # 📦 Upload build output as artifact
      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: frontend/dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Path updated to point to the build folder inside frontend
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
          cname: neuros.care
          force_orphan: true
          allow_empty_commit: false