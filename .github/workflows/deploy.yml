# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build

      # 🔍 Confirm build output exists
      - name: Check dist directory
        run: |
          echo "Current directory:"
          pwd
          echo "List root files:"
          ls -la
          echo "List dist directory:"
          ls -la dist || echo "❌ dist directory not found"

      # 🔍 Print ALL files that will be deployed
      - name: Print files to be deployed
        run: |
          echo "Files to be deployed from dist:"
          find dist -type f
          
      - name: Print file timestamps (mtime)
        run: |
          echo "File modification times in dist:"
          find dist -type f -exec stat --format='%y  %n' {} \;    

      # 📦 Optional: Upload build output as artifact (VERY helpful)
      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: neuros.care
